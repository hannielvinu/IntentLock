services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intentlock
      POSTGRES_PASSWORD: intentlock_local
      POSTGRES_DB: intentlock
    ports:
      - "5432:5432"
    volumes:
      - intentlock-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentlock -d intentlock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  intentlock-postgres:
